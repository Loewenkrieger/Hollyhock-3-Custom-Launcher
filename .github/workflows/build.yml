name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y g++ python3
      - run: make test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-tests
          path: dist/tests-host.json
          if-no-files-found: error

  calculator:
    name: Calculator build
    needs: host
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/classpaddev/hollyhock-3@sha256:4381a460f8b19411552ac30f2aba73da38d3aba535412a66c69f8528fe94b49a
    env:
      SDK_DIR: meta/hollyhock-3/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install packaging tools
        run: apt-get update && apt-get install -y python3 ca-certificates
      - name: Trust the mounted checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/meta/hollyhock-3"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: host-tests
          path: dist
      - name: Build launcher and test app
        run: make -j2 launcher smoke
      - run: make target-test
      - run: make package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-os7002
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: calculator
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-os7002
          path: release
      - name: Check release files
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import json,os; assert os.environ["RELEASE_TAG"] == json.load(open("tools/release.json"))["tag"], "Tag does not match tools/release.json"'
          gh release create "$RELEASE_TAG" release/* --verify-tag \
            --title "Hollyhock Launcher $RELEASE_TAG" --notes-file docs/RELEASE.md
